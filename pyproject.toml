[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-pipeline"
version = "0.1.0"
description = "Pretrained-only tiled detection + segmentation pipeline for densely packed fruit images"
readme = "README.md"
requires-python = ">=3.10"

# This directory is named 'fruit-pipeline' (hyphen), but every module and
# the README document `import fruit_pipeline` / `python -m fruit_pipeline.cli`
# (underscore) -- this mapping is what actually makes that importable,
# without renaming the directory itself. Install with `pip install -e .`
# from within this directory.
[tool.setuptools]
package-dir = { "fruit_pipeline" = "." }
packages = ["fruit_pipeline", "fruit_pipeline.eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
